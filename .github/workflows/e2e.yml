# Packages the app on GitHub's Mac and Windows machines and runs the end-to-end smoke test against the packaged app
# (tests/e2e/smoke.cjs: analysis, muted playback with the audio measured, stems, sampler, loops, export, save / reopen,
# toolbar layout, screenshots). The screenshots and report are kept for a few days.
name: E2E

# Started by hand: choose the systems and whether to run the update tests too.
on:
  workflow_dispatch:
    inputs:
      systems:
        description: 'Systems'
        type: choice
        options: [both, mac, windows]
        default: both
      update_test:
        description: 'Also run the update test'
        type: boolean
        default: false
      update_github:
        description: 'Also update a 0.0.1 build from the real latest release on GitHub'
        type: boolean
        default: false
      probe_only:
        description: 'Only the quick ONNX probe (no packaging)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The analysis process with the models, run like the app runs it (quick: no packaging).
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.systems == 'mac' && '["macos-latest"]' || inputs.systems == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - name: Windows code signing script (one-time codes against RFC 6238)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/certum-login.ps1 -SelfTest
      - name: ONNX probe (default settings)
        shell: bash
        run: node tests/e2e/onnx-probe.cjs "$(node -p "require('electron')")" build models
      - name: ONNX probe (memory arena on)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          DJAW_ORT_ARENA: '1'
        run: node tests/e2e/onnx-probe.cjs "$(node -p "require('electron')")" build models

  e2e:
    if: ${{ !inputs.probe_only }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.systems == 'mac' && '["macos-latest"]' || inputs.systems == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.mjs
      - name: Package
        shell: bash
        run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac --arm64' || '--win --x64' }} --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Video preview without Playwright (packaged app)
        run: node tests/e2e/preview-stress.cjs ${{ matrix.os == 'macos-latest' && 'dist/mac-arm64/DJAW.app/Contents/MacOS/DJAW' || 'dist/win-unpacked/DJAW.exe' }} 10
      - name: Smoke test (packaged app)
        run: node tests/e2e/smoke.cjs ${{ matrix.os == 'macos-latest' && 'dist/mac-arm64/DJAW.app/Contents/MacOS/DJAW' || 'dist/win-unpacked/DJAW.exe' }}
        env:
          # Chromium's own warnings and errors (why a renderer was killed) go to the app's stderr, which the test prints.
          ELECTRON_ENABLE_LOGGING: '1'
      - name: ffmpeg (to check the exported files)
        shell: bash
        run: command -v ffmpeg || ( [ "$RUNNER_OS" = "Windows" ] && choco install ffmpeg -y --no-progress >/dev/null || brew install ffmpeg >/dev/null ); ffmpeg -version | head -1
      - name: Sound and pictures in step (exported MP4 / M4A)
        run: node tests/e2e/av-sync.cjs ${{ matrix.os == 'macos-latest' && 'dist/mac-arm64/DJAW.app/Contents/MacOS/DJAW' || 'dist/win-unpacked/DJAW.exe' }}
      - name: Windows crash reports (when something crashed)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddHours(-1) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting|Application Hang' } |
            Select-Object -First 6 | ForEach-Object { "=== $($_.TimeCreated) $($_.ProviderName) $($_.Id)"; $_.Message }
      - name: Mac crash reports (when something crashed)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3); do
            echo "=== $f"
            python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read().split('\n', 1)
          head = json.loads(raw[0]); body = json.loads(raw[1])
          print(head.get('app_name'), head.get('name'), body.get('exception'), body.get('termination'))
          th = body['threads'][body.get('faultingThread', 0)]
          imgs = body.get('usedImages', [])
          for fr in th.get('frames', [])[:25]:
              img = imgs[fr['imageIndex']] if fr.get('imageIndex') is not None and fr['imageIndex'] < len(imgs) else {}
              print('  ', img.get('name', '?'), fr.get('symbol', ''), fr.get('imageOffset'))
          print('asi', json.dumps(body.get('asi', {}))[:1500])
          PY
          done
      - name: Keep the screenshots (a draft release "e2e-results", visible only to the repository's owner)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d e2e-out ] || exit 0
          gh release view e2e-results >/dev/null 2>&1 || gh release create e2e-results --draft --title "E2E results" --notes "Screenshots of the automated tests (overwritten on every run)." || true
          sleep 5
          cd e2e-out
          for f in *; do mv "$f" "${{ runner.os }}-$f"; done
          gh release upload e2e-results * --clobber

  # The app updating itself: an installed older build finds 9.9.9 (a local test feed), downloads, installs and restarts.
  update:
    if: ${{ inputs.update_test && !inputs.probe_only }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.systems == 'mac' && '["macos-latest"]' || inputs.systems == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - name: Mac — the installed app, then 9.9.9 as a disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -e
          npx electron-builder --mac --arm64 --dir --publish never
          mkdir -p "$RUNNER_TEMP/apps" && ditto dist/mac-arm64/DJAW.app "$RUNNER_TEMP/apps/DJAW.app"
          rm -rf dist
          npm version 9.9.9 --no-git-tag-version
          npx electron-builder --mac dmg --arm64 --publish never
          node tests/e2e/update.cjs "$RUNNER_TEMP/apps/DJAW.app/Contents/MacOS/DJAW" dist/DJAW-9.9.9-mac-arm64.dmg
      - name: Windows — install, then 9.9.9 as an installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --win nsis --x64 --publish never
          $setup = Get-ChildItem dist\DJAW-Setup-*.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\DJAW\DJAW.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse "$env:LOCALAPPDATA\Programs" -Filter DJAW.exe | Select-Object -First 3 | Format-List FullName; throw "not installed at $exe" }
          Remove-Item -Recurse -Force dist
          npm version 9.9.9 --no-git-tag-version
          npx electron-builder --win nsis --x64 --publish never
          node tests/e2e/update.cjs $exe dist\DJAW-Setup-9.9.9.exe

  # The real feed: a 0.0.1 build (this code) finds the latest release of WVYYYVW/DJAW, downloads it from GitHub,
  # checks its SHA-256, installs it and restarts.
  update-github:
    if: ${{ inputs.update_github && !inputs.probe_only }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.systems == 'mac' && '["macos-latest"]' || inputs.systems == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The same installer downloaded directly (to compare the app's download speed with)
        shell: bash
        run: |
          pat=$([ "$RUNNER_OS" = macOS ] && echo 'mac-arm64\.dmg$' || echo '^DJAW-Setup-.*\.exe$')
          url=$(curl -s https://api.github.com/repos/WVYYYVW/DJAW/releases/latest | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s).assets.find(a=>new RegExp(process.argv[1]).test(a.name));console.log(a.browser_download_url)})" "$pat")
          echo "$url"
          curl -sL -o "$RUNNER_TEMP/direct.bin" -w 'direct download: %{size_download} bytes in %{time_total} s (%{speed_download} bytes/s)\n' "$url"
          rm -f "$RUNNER_TEMP/direct.bin"
      - run: npm version 0.0.1 --no-git-tag-version
      - run: node scripts/build.mjs
      - name: Mac — a 0.0.1 app updates from GitHub
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -e
          npx electron-builder --mac --arm64 --dir --publish never
          mkdir -p "$RUNNER_TEMP/apps" && ditto dist/mac-arm64/DJAW.app "$RUNNER_TEMP/apps/DJAW.app"
          node tests/e2e/update.cjs "$RUNNER_TEMP/apps/DJAW.app/Contents/MacOS/DJAW" --github
      - name: Windows — an installed 0.0.1 updates from GitHub
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --win nsis --x64 --publish never
          $setup = Get-ChildItem dist\DJAW-Setup-*.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\DJAW\DJAW.exe'
          node tests/e2e/update.cjs $exe --github
