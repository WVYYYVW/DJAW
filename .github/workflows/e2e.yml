# Packages the app on GitHub's Mac and Windows machines and runs the end-to-end smoke test against the packaged app
# (tests/e2e/smoke.cjs: analysis, muted playback with the audio measured, stems, sampler, loops, export, save / reopen,
# toolbar layout, screenshots). The screenshots and report are kept for a few days.
name: E2E

# Started by hand (macOS minutes are costly on a private repository): choose the systems and whether to run the
# update test too.
on:
  workflow_dispatch:
    inputs:
      systems:
        description: 'Systems'
        type: choice
        options: [both, mac, windows]
        default: both
      update_test:
        description: 'Also run the update test'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.systems == 'mac' && '["macos-latest"]' || inputs.systems == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}
        include:
          - os: macos-latest
            pack: npx electron-builder --mac --arm64 --dir --publish never
            app: dist/mac-arm64/DJAW.app/Contents/MacOS/DJAW
          - os: windows-latest
            pack: npx electron-builder --win --x64 --dir --publish never
            app: dist/win-unpacked/DJAW.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.mjs
      - name: Package
        run: ${{ matrix.pack }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test (packaged app)
        run: node tests/e2e/smoke.cjs ${{ matrix.app }}
      - name: Keep the screenshots (a draft release "e2e-results", visible only to the repository's owner)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d e2e-out ] || exit 0
          gh release view e2e-results >/dev/null 2>&1 || gh release create e2e-results --draft --title "E2E results" --notes "Screenshots of the automated tests (overwritten on every run)." || true
          sleep 5
          cd e2e-out
          for f in *; do mv "$f" "${{ runner.os }}-$f"; done
          gh release upload e2e-results * --clobber

  # The app updating itself: an installed older build finds 9.9.9 (a local test feed), downloads, installs and restarts.
  update:
    if: ${{ inputs.update_test }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.systems == 'mac' && '["macos-latest"]' || inputs.systems == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - name: Mac — the installed app, then 9.9.9 as a disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -e
          npx electron-builder --mac --arm64 --dir --publish never
          mkdir -p "$RUNNER_TEMP/apps" && ditto dist/mac-arm64/DJAW.app "$RUNNER_TEMP/apps/DJAW.app"
          rm -rf dist
          npm version 9.9.9 --no-git-tag-version
          npx electron-builder --mac dmg --arm64 --publish never
          node tests/e2e/update.cjs "$RUNNER_TEMP/apps/DJAW.app/Contents/MacOS/DJAW" dist/DJAW-9.9.9-mac-arm64.dmg
      - name: Windows — install, then 9.9.9 as an installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --win nsis --x64 --publish never
          $setup = Get-ChildItem dist\DJAW-Setup-*.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\DJAW\DJAW.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse "$env:LOCALAPPDATA\Programs" -Filter DJAW.exe | Select-Object -First 3 | Format-List FullName; throw "not installed at $exe" }
          Remove-Item -Recurse -Force dist
          npm version 9.9.9 --no-git-tag-version
          npx electron-builder --win nsis --x64 --publish never
          node tests/e2e/update.cjs $exe dist\DJAW-Setup-9.9.9.exe
