# Builds the Windows installer and the Mac (Apple Silicon) disk image on GitHub's own machines and publishes them
# as a GitHub Release. Runs when a version tag (v0.2.0, …) is pushed, or by hand from the Actions tab.
# The release is created first and each build uploads its file to it directly (no workflow artifacts: their storage
# is limited).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check only (no release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT";
          else echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: DJAW ${{ steps.v.outputs.tag }}
          body_path: RELEASE_NOTES.md
          make_latest: true

  build:
    needs: prepare
    if: ${{ always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npx electron-builder --win --x64 --publish never
            files: dist/*.exe
          - os: macos-latest
            command: npx electron-builder --mac --arm64 --publish never
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.mjs
      - name: Package
        run: ${{ matrix.command }}
        env:
          # No Apple / Windows signing certificate: the Mac app is signed ad hoc (scripts/after-pack.cjs).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the Mac app (signature, icon, the disk image)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          app=dist/mac-arm64/DJAW.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature=adhoc|Identifier='
          test -f "$app/Contents/Resources/icon.icns"
          # The app inside the disk image, as a user gets it.
          dmg=$(ls dist/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          codesign --verify --deep --strict --verbose=2 "$mnt/DJAW.app"
          hdiutil detach "$mnt"
      - uses: softprops/action-gh-release@v2
        if: ${{ !inputs.dry_run }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
