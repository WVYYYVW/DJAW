# Builds the Windows installer and the Mac (Apple Silicon) disk image on GitHub's own machines and publishes them
# as a GitHub Release. Runs when a version tag (v0.2.0, …) is pushed, or by hand from the Actions tab.
# The release is created first and each build uploads its file to it directly (no workflow artifacts: their storage
# is limited).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT";
          else echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: DJAW ${{ steps.v.outputs.tag }}
          body_path: RELEASE_NOTES.md
          make_latest: true

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npx electron-builder --win --x64 --publish never
            files: dist/*.exe
          - os: macos-latest
            command: npx electron-builder --mac --arm64 --publish never
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.mjs
      - name: Package
        run: ${{ matrix.command }}
        env:
          # No Apple / Windows signing certificate: the Mac app is signed ad hoc (see package.json "mac").
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
